name: Bug report
description: Report a reproducible bug in Sandesh
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please include enough detail
        for us to reproduce the issue. See [CONTRIBUTING.md](../../CONTRIBUTING.md).

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Short description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps, API calls, or a small repo/gist if possible
      placeholder: |
        1. Start stack with docker compose
        2. Trigger event X
        3. Observe error Y
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.4.7 or commit SHA

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Docker version:
        Browser (if UI):

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Stack traces, API responses, or screenshots
