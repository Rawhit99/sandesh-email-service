name: Feature request
description: Suggest an enhancement for Sandesh
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want solved and how Sandesh could help.
        For large features, maintainers may ask for a design discussion first.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What pain point does this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should Sandesh behave?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API / backend
        - Python SDK
        - Dashboard (frontend)
        - Channels / providers
        - Documentation
        - DevOps / packaging
        - Other

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a pull request for this feature
          required: false
