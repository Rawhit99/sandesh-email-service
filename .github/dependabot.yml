# Dependabot opens PRs only — it does not publish SDK/CLI or merge to main.
# Tuned to avoid flooding Actions on first enable.

version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 3
    groups:
      backend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 3
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  # Optional: comment out this block to stop github-actions bump PRs entirely
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
