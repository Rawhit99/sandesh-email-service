[project]
name = "sandesh-sdk"
version = "0.4.6"
description = "Official Python SDK for the Sandesh notification API."
authors = [
    {name = "Rohit Thakur", email = "rohithakur0208@gmail.com"},
]
dependencies = [
    "httpx>=0.25.0",
]
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
keywords = ["sandesh", "notifications", "sdk", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[build-system]
requires = ["setuptools>=69", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.exclude-package-data]
sandesh = ["*.c"]
"sandesh.sdk" = ["*.c"]

[tool.setuptools.package-data]
sandesh = ["py.typed", "*.pyi"]
"sandesh.sdk" = ["*.pyi"]

[tool.setuptools.packages.find]
include = ["sandesh", "sandesh.*"]

[project.optional-dependencies]
build = [
    "build>=1.2.2",
    "twine>=6.0.0",
    "Cython>=3.0",
]
